<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Black Friday | Naguib Selim</title>
  <meta name="description" content="Naguib Selim Black Friday – up to 40% off Home, up to 50% off fabrics, free Wavy. عروض البلاك فرايدي من نجيب سليم – خصومات تصل إلى 40%." />
  <meta property="og:title" content="Black Friday – Naguib Selim | Up to 50% Off" />
  <meta property="og:image" content="https://naguibselim.com/cdn/shop/files/FF_up_to_40__jpg.jpg?v=1793467882&width=1200" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="https://naguibselim.com/cdn/shop/files/ns-logo.png?v=1778749143" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #777777;
      --line: #eeeeee;
      --wa: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); }
    body {
      font-family: "Montserrat", system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    html[lang="ar"] body { font-family: "Cairo", system-ui, Tahoma, sans-serif; }
    a { color: inherit; text-decoration: none; }

    /* Faded background words — just two, very subtle */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; user-select: none;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: "Montserrat", sans-serif;
      font-weight: 900;
      line-height: .9;
      color: #000;
      direction: ltr;
      text-align: center;
    }
    .bg .w1 { font-size: 15vw; letter-spacing: -.02em; opacity: .035; }
    .bg .w2 { font-size: 30vw; letter-spacing: -.03em; opacity: .035; }

    /* Animated 40% badge */
    .badge {
      position: relative;
      width: min(60vw, 220px);
      aspect-ratio: 1;
      margin: 36px auto 0;
      opacity: .35;
      pointer-events: none;
      direction: ltr;
    }
    .badge .ring {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      animation: spin 14s linear infinite;
    }
    .badge .ring text {
      font: 900 11px "Montserrat", sans-serif;
      letter-spacing: 3.2px;
      fill: #000;
    }
    .badge .num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: min(17vw, 64px);
      font-weight: 900;
      color: #c8102e;
      animation: pulse 2.4s ease-in-out infinite;
    }
    .badge .num span { animation: flip 6s ease-in-out infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes flip { 0%,70% { transform: rotateY(0); } 85%,100% { transform: rotateY(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .badge .ring, .badge .num, .badge .num span { animation: none; }
    }

    .page { position: relative; z-index: 1; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1100px; margin: 0 auto;
      padding: 18px 20px;
    }
    header img { height: 30px; width: auto; display: block; }
    .lang {
      background: none; border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 16px; cursor: pointer;
      font: 700 13px "Cairo", "Montserrat", sans-serif; color: var(--text);
    }
    .lang:hover { border-color: var(--text); }

    .banner {
      display: block;
      max-width: 1100px; margin: 0 auto;
      padding: 0 20px;
    }
    .banner img { display: block; width: 100%; height: auto; border-radius: 10px; }

    main {
      max-width: 560px; margin: 0 auto;
      padding: 48px 20px 72px;
      text-align: center;
    }
    h1 {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    html[lang="ar"] h1 { font-weight: 700; line-height: 1.5; }
    p { color: var(--muted); font-size: 17px; margin-bottom: 32px; }

    .offers {
      list-style: none; margin: 8px auto 20px; max-width: 380px;
      border-top: 1px solid var(--line);
    }
    .offers li {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 4px; border-bottom: 1px solid var(--line);
      text-align: start; font-size: 16px;
    }
    .offers b {
      min-width: 64px; font-size: 22px; font-weight: 900; color: #c8102e;
      font-family: "Montserrat", sans-serif; direction: ltr; text-align: center;
    }
    p.small { font-size: 14px; margin-bottom: 28px; }
    .btn {
      display: block; width: 100%; max-width: 320px; margin: 0 auto;
      padding: 16px; border-radius: 8px;
      font-weight: 700; font-size: 16px; letter-spacing: .5px;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .shop { background: var(--text); color: #fff; margin-bottom: 14px; }
    .wa {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 15px; color: var(--muted);
    }
    .wa svg { width: 18px; height: 18px; fill: var(--wa); }
    .wa:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="w1">BLACK FRIDAY</div>
    <div class="w2">SALE</div>
  </div>

  <div class="page">
    <header>
      <a href="https://naguibselim.com/"><img src="https://naguibselim.com/cdn/shop/files/16862.webp?height=60&v=1769587548" alt="Naguib Selim" /></a>
      <button class="lang" id="lang" type="button">عربي</button>
    </header>

    <a class="banner js-shop" href="https://naguibselim.com/collections/naguib-selim-black-friday">
      <img src="https://naguibselim.com/cdn/shop/files/FF_up_to_40__jpg.jpg?v=1793467882&width=1920"
           srcset="https://naguibselim.com/cdn/shop/files/FF_up_to_40__jpg.jpg?v=1793467882&width=800 800w,
                   https://naguibselim.com/cdn/shop/files/FF_up_to_40__jpg.jpg?v=1793467882&width=1920 1920w"
           sizes="(max-width: 1100px) 100vw, 1100px"
           alt="Naguib Selim Black Friday" fetchpriority="high" />
    </a>

    <main>
      <h1 data-t="title">Black Friday Offers</h1>
      <ul class="offers">
        <li><b>40%</b><span data-t="o1">Up to 40% off Naguib Selim Home</span></li>
        <li><b>50%</b><span data-t="o2">Up to 50% off Naguib Selim fabrics</span></li>
        <li><b data-t="free">FREE</b><span data-t="o3">Wavy for free</span></li>
      </ul>
      <p class="small" data-t="desc">Limited time only.</p>

      <a class="btn shop js-shop" href="https://naguibselim.com/collections/naguib-selim-black-friday" data-t="shop">Shop Now</a>

      <a class="wa" id="wa" href="https://wa.me/201111017791" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
        <span data-t="wa">Need help? WhatsApp us</span>
      </a>
      <div class="badge">
        <svg class="ring" viewBox="0 0 200 200">
          <defs><path id="circle" d="M100,100 m-82,0 a82,82 0 1,1 164,0 a82,82 0 1,1 -164,0" /></defs>
          <circle cx="100" cy="100" r="96" fill="none" stroke="#000" stroke-width="2" />
          <circle cx="100" cy="100" r="66" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 6" />
          <text><textPath href="#circle">BLACK FRIDAY • UP TO 50% OFF • SALE • </textPath></text>
        </svg>
        <div class="num"><span>50%</span></div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var SHOP = 'https://naguibselim.com/collections/naguib-selim-black-friday';
      var T = {
        en: { title: 'Black Friday Offers', desc: 'Limited time only.',
              o1: 'Up to 40% off Naguib Selim Home', o2: 'Up to 50% off Naguib Selim fabrics', o3: 'Wavy for free', free: 'FREE',
              shop: 'Shop Now', wa: 'Need help? WhatsApp us', toggle: 'عربي',
              msg: 'Hi, I have a question about the Black Friday offers' },
        ar: { title: 'عروض البلاك فرايدي', desc: 'لفترة محدودة.',
              o1: 'خصم حتى 40% على نجيب سليم هوم', o2: 'خصم حتى 50% على أقمشة نجيب سليم', o3: 'الويفي مجاناً', free: 'مجاناً',
              shop: 'تسوق الآن', wa: 'محتاج مساعدة؟ كلمنا واتساب', toggle: 'EN',
              msg: 'أهلاً، عندي استفسار عن عروض البلاك فرايدي' }
      };
      var current = 'en';

      // keep ad/UTM params on store links
      var shop = SHOP;
      try {
        var u = new URL(SHOP);
        new URLSearchParams(location.search).forEach(function (v, k) { if (k !== 'lang') u.searchParams.set(k, v); });
        shop = u.toString();
      } catch (e) {}
      document.querySelectorAll('.js-shop').forEach(function (a) { a.href = shop; });

      function setLang(l) {
        current = l;
        var t = T[l];
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')]; });
        document.getElementById('lang').textContent = t.toggle;
        document.getElementById('wa').href = 'https://wa.me/201111017791?text=' + encodeURIComponent(t.msg);
        try { localStorage.setItem('ns_lang', l); } catch (e) {}
      }

      document.getElementById('lang').addEventListener('click', function () {
        setLang(current === 'en' ? 'ar' : 'en');
      });

      var start = 'en';
      try {
        var q = new URLSearchParams(location.search).get('lang');
        var s = localStorage.getItem('ns_lang');
        if (q === 'ar' || q === 'en') start = q;
        else if (s === 'ar' || s === 'en') start = s;
        else if ((navigator.language || '').toLowerCase().indexOf('ar') === 0) start = 'ar';
      } catch (e) {}
      setLang(start);
    })();
  </script>
</body>
</html>
